[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "harness-engineering-starter"
version = "1.3.0"
description = "Reusable scaffold and hardened SPEC-compatible runtime for agent-friendly project engineering."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Harness Engineering Starter contributors" }]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]
schema = ["jsonschema>=4"]

[project.scripts]
harness = "harness.cli:main"

[tool.setuptools]
packages = ["harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
