[build-system]
requires = ["setuptools>=68", "wheel>=0.42"]
build-backend = "setuptools.build_meta"

[project]
name = "harness-engineering-starter"
version = "1.4.1"
description = "Reusable scaffold and hardened SPEC-compatible runtime for agent-friendly project engineering."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Harness Engineering Starter contributors" }]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]
schema = ["jsonschema>=4"]

[project.scripts]
harness = "harness.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["harness*"]

[tool.setuptools.package-data]
harness = ["template_data/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
