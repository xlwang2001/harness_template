name: Harness Docs

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate-harness-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install harness-engineering-starter
      - run: harness validate --target .
